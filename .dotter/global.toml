[fish]
depends = ["starship"]

[fish.files]
fish = "~/.config/fish"

[starship.files]
"starship.toml" = "~/.config/starship.toml"

[hyprland]
depends = ["tofi", "waybar"]

[hyprland.files]
hyprland = "~/.config/hypr"

[tofi.files]
tofi = "~/.config/tofi/config"

[waybar.files]
waybar = "~/.config/waybar"

[waybar.variables]
laptop = false

[eww.files]
eww = "~/.config/eww"

[swaync.files]
swaync = "~/.config/swaync"

[swayimg.files]
swayimg = "~/.config/swayimg"

[mimeapps.files]
"mimeapps.list" = "~/.config/mimeapps.list"

[zed.files]
"zed" = "~/.config/zed"

[sysctl.files]
"sysctl" = "/etc/sysctl.d/"

[zen.files]
"applications/zen.desktop" = "~/.local/share/applications/zen.desktop"
"applications/zen-me.desktop" = "~/.local/share/applications/zen-me.desktop"
"applications/zen-deploy.desktop" = "~/.local/share/applications/zen-deploy.desktop"
